; Mitigation for CVE-2026-109618 / CVE-2026-109619 ("PHP2Shell", CVSS v4.0 9.2).
;
; Official root cause (php.net advisory + GHSA, published 2026-10-21 14:00 UTC):
;  - GHSA-w8hw-w9fx-j79w / CVE-2026-109618 "RCE via OOM corruption": out-of-memory
;    handling can interrupt PHP while internal request data is only partially
;    initialised, and request cleanup then treats that invalid data as valid.
;  - GHSA-6wmf-4rv5-p3rp / CVE-2026-109619 "RCE via stale global state": state owned
;    by an earlier request survives into a later one when a fatal problem stops
;    normal reset. Needs a PRODUCER (an operation interrupted before completion) and
;    a CONSUMER that acts on the stale state before normal request initialisation.
;    Two confirmed consumers: INI diagnostics applied before request init, and
;    session upload progress. Unauthenticated — "this app has no upload form" is NOT
;    protection, and stale state survives even when short init fails.
;  (The earlier third-party framing — a UAF in php_session_rfc1867_callback,
;   https://jackalsyn.com/posts/php-up-2026.html — describes the upload-progress
;   consumer, i.e. one of the paths.)
;
; PHP: "There is no complete generic configuration mitigation for these issues."
; For this consumer the advisory is explicit: "Set session.upload_progress.enabled=0
; administratively and restart every worker. Do not rely on ini_set() or FPM
; .user.ini: the consumer runs before per-script configuration is applied." That is
; what conf.d does, and it covers BOTH tiers (php -S web + messenger:consume
; worker), because both read /usr/local/etc/php/conf.d.
;
; KEEP THIS FILE even after the runtime is patched — the advisory says so itself:
; "it might be prudent to set session.upload_progress.enabled=0 if you don't need
; this feature even after applying the patch, as more attackers try to find flaws in
; this hardly-used and hardly-tested feature." Drop it only if we ever build a
; server-side upload progress UI.
;
; Cost for KLMS: none. Nothing reads upload-progress session data
; (`grep -rn upload_progress src templates assets public/build` = no hits) and the
; admin gallery bulk-upload bar is client-side (assets/js/admin/gallery.js: fetch()
; + a striped CSS bar), so there is no user-visible change. Uploads are untouched:
; file_uploads / upload_max_filesize (2M) / post_max_size (8M) unchanged, and 8M is
; already the clamp PHP recommends for CVE-2026-109618 ("8M if no uploads are
; needed, 32M if they are").
;
; THIS IS STILL NOT THE FIX. Fixed runtimes are PHP 8.2.35 / 8.3.36 / 8.4.27 /
; 8.5.12; our base is pinned to PHP 8.4.26 (php:8.4-cli@sha256:c4723acd...), and
; the official Docker image for 8.4.27 did not exist when this was written
; (docker-library/php#1694 open). Re-pin ../Dockerfile and rebuild as soon as the
; tag is published — see docker/README.md.

session.upload_progress.enabled = Off
