; Pre-patch mitigation for CVE-2026-109618 / CVE-2026-109619 ("PHP2Shell").
;
; Reported root cause: PHP's session upload-progress handler
; (php_session_rfc1867_callback in ext/session/session.c) caches two raw
; zval pointers — post_bytes_processed / current_file_bytes_processed — into
; HashTables that the request lifecycle can free underneath it. A second
; session update while a multipart body is still arriving frees the decoded
; tree through zval_ptr_dtor; the stale pointer is then reused, which third-party
; research turns into a call via zend_call_function(). Reachable from an
; unauthenticated multipart/form-data POST to ANY route, BEFORE any application
; code runs — an app with no upload form is still on the parse path.
;   report: https://jackalsyn.com/posts/php-up-2026.html
;   notice: https://www.php.net/archive/2026.php#2026-10-20-1
;
; Disabling the feature closes that path. Nothing in this app reads the
; upload-progress session data — `grep -rn upload_progress src templates assets
; public/build` has no hits, and the admin gallery bulk-upload progress bar is
; client-side (fetch() + a striped CSS bar in assets/js/admin/gallery.js), so
; there is no user-visible change. Uploads themselves are untouched
; (file_uploads / upload_max_filesize / post_max_size stay as they are).
;
; THIS IS NOT THE FIX — it is one of the two reported paths:
;  - the other reported path is in the multipart parser itself, which runs for
;    every multipart/form-data POST regardless of this setting;
;  - the actual fix is a patched PHP runtime. PHP's emergency release is
;    scheduled for 2026-10-21 14:00 UTC; once it is out, re-pin the base image
;    in ../Dockerfile, rebuild, and revisit whether this file is still needed.

session.upload_progress.enabled = Off
