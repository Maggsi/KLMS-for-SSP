; PHP performance tuning for the KLMS image (loaded by both the web tier,
; which runs under the cli-server SAPI, and the messenger worker, which runs
; under the cli SAPI).
;
; opcache is OFF by default under the cli SAPI — the worker enables it with
; `php -d opcache.enable_cli=1` (see klms-entrypoint.sh). The settings below
; apply to both tiers.
opcache.enable_cli=1
; 256 MB so the whole Symfony+vendor codebase stays cached and is not evicted.
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_file_size=5M
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.jit=0
