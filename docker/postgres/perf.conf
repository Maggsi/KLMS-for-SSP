# Light postgres tuning for the KLMS stack (mounted read-only into
# /etc/postgresql/conf.d/; see compose.yaml). Sized for the bigboy test
# box (32 GB RAM per host) — a small app, not a server farm.
# max_connections is left at the default.
shared_buffers=256MB
effective_cache_size=1GB
work_mem=16MB
maintenance_work_mem=64MB
